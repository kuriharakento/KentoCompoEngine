name: ReleaseBuild

on:
  push:
    branches:
      - main

env:
  SOLUTION_FILE_PATH: engine/KentoCompoEngine.vcxproj
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: engine

    - name: Create dummy application headers for build compatibility
      run: |
        mkdir -p application/scene/debug
        mkdir -p application/scene/play
        echo -e "#pragma once\n#include \"scene/interface/BaseScene.h\"\nclass ParticleTestScene : public BaseScene { public: void Initialize() override {} void Finalize() override {} void Draw2D() override {} };" > application/scene/debug/ParticleTestScene.h
        echo -e "#pragma once\n#include \"scene/interface/BaseScene.h\"\nclass TestScene : public BaseScene { public: void Initialize() override {} void Draw2D() override {} };" > application/scene/debug/TestScene.h
        echo -e "#pragma once\n#include \"scene/interface/BaseScene.h\"\nclass TitleScene : public BaseScene { public: void Initialize() override {} void Finalize() override {} void Draw2D() override {} };" > application/scene/play/TitleScene.h
      shell: bash

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Build
      run: |
        msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Platform=x64 /p:Configuration=${{ env.CONFIGURATION }}

    - name: Discord Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_BUILD }}
        status: ${{ job.status }}
        title: "GitHub Actions: ReleaseBuild"
